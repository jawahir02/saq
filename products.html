<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | SAQ Building Materials</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <style>
        .page-header {
            padding: 130px 0 50px;
            position: relative;
            background-image: url('parallax.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--charcoal);
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .page-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(249, 248, 246, 0.88);
            z-index: 1;
        }
        .page-header .container {
            position: relative;
            z-index: 2;
        }
        #all-products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
        }
        .cat-card {
            background: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        .cat-card:hover {
            transform: translateY(-5px);
        }
        @media (max-width: 768px) {
            .page-header {
                background-attachment: scroll !important;
            }
            .final-cta.section-padding {
                padding-top: 30px !important;
                padding-bottom: 30px !important;
            }
            #all-products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.5rem;
            }
            .cat-content {
                padding: 0.5rem !important;
            }
        }
    </style>
</head>
<body>
    <saq-header></saq-header>

    <main>
        <section class="page-header">
            <div class="container">
                <span class="eyebrow" style="color: var(--navy-blue); margin-bottom: -0.2rem; display: block; position: relative; z-index: 1;">Explore Our Range</span>
                <h1 style="color: var(--charcoal); margin-bottom: 0; font-size: clamp(32px, 6.9vw, 66px); letter-spacing: 0.05em; line-height: 1.1; position: relative; z-index: 2;">Our Products</h1>
            </div>
        </section>

        <section class="section-padding" style="background-color: #EFECE6;">
            <div class="container">
                <div class="category-grid" id="all-products-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </section>

        <section class="bg-charcoal text-white final-cta" style="padding: 30px 0;">
            <div class="container text-center" style="max-width: 800px;">
                <h2 class="section-title" style="color: white; margin-bottom: 0;">Can't find what you're looking for?</h2>
                <div class="cta-btns" style="justify-content: center; margin-top: 1rem;">
                    <a href="mailto:sales@saqtrading.com?subject=Request%20a%20Quote%20-%20SAQ%20Building%20Materials&body=Hello%20SAQ%20Team%2C%0A%0AI%20would%20like%20to%20request%20a%20price%20quote%20for%20the%20following%3A%0A%0AMaterial%2FProduct(s)%3A%20%0AQuantity%3A%20%0ADelivery%20Location%3A%20%0AContact%20Name%20%26%20Number%3A%20%0A%0AThank%20you." class="btn btn-accent">Request a Quote</a>
                </div>
            </div>
        </section>
    </main>

    <saq-footer></saq-footer>
    <mobile-contact-bar></mobile-contact-bar>

    <script src="js/data.js?v=3"></script>
    <script src="js/components.js?v=114"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('all-products-grid');
            if (grid && window.siteData && window.siteData.categories) {
                window.siteData.categories.forEach((cat, index) => {
                    const card = document.createElement('a');
                    card.href = `${cat.slug}.html`;
                    card.id = cat.id;
                    card.className = 'cat-card fade-in-up';
                    card.style.transitionDelay = `${(index % 4) * 0.1}s`;
                    card.style.display = 'flex';
                    card.style.flexDirection = 'column';
                    
                    card.innerHTML = `
                        <div class="cat-img-wrapper" style="width: 100%; aspect-ratio: 1/1; background: white; overflow: hidden; position: relative; border-bottom: 1px solid rgba(0,0,0,0.05);">
                            <img style="width: 100%; height: 100%; object-fit: cover; padding: 0;" src="${cat.img}" alt="${cat.name}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                            <div style="width:100%; height:100%; background:var(--warm-beige); position:absolute; top:0; left:0; display:none; align-items:center; justify-content:center; color:var(--charcoal); text-align:center; padding:1rem; font-size:0.8rem;">[IMG: ${cat.name}]</div>
                        </div>
                        <div class="cat-content" style="padding: 0.8rem; text-align: left;">
                            <div style="font-family:var(--font-secondary); font-size:0.8rem; color:var(--charcoal); margin-bottom:0.5rem;">0${index + 1}</div>
                            <h3 style="color: var(--charcoal); font-family: var(--font-primary); font-size: 1.1rem; margin: 0; text-transform: uppercase; font-weight: 700;">${cat.name}</h3>
                            <p class="prod-desc" style="font-size: 0.72rem; text-transform: lowercase; color: #777; margin-top: 4px; line-height: 1.3;">${cat.desc}</p>
                        </div>

                    `;
                    grid.appendChild(card);
                });
                
                // Trigger intersection observer for new elements
                const fadeElements = document.querySelectorAll('.fade-in-up');
                const observer = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            obs.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                fadeElements.forEach(el => observer.observe(el));
            }
        });
    </script>
</body>
</html>
