<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brands | SAQ Building Materials</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <style>
        :root {
            --navy-blue: #1A2B4C;
            --charcoal: #363636;
            --gold: #B89C5D;
        }
        .page-header {
            padding: 120px 0 50px;
            background: #FDFBF9;
            color: var(--charcoal);
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .page-header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 0.5rem;
        }
        .page-header .eyebrow {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
        }
        /* Section with Subtle Shadow-like Leaf Texture on Charcoal */
        .partners-section {
            position: relative;
            background-color: var(--charcoal, #363636);
            padding: 4rem 0 5rem;
            overflow: hidden;
            z-index: 1;
        }
        .partners-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('parallax.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }
        .partners-section .container {
            position: relative;
            z-index: 1;
        }

        /* Row-based brand grid */
        #all-brands-grid {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: wrap !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 2rem !important;
            padding: 1rem 0 !important;
        }
        .brand-logo-item {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            background: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 12px !important;
            padding: 1.5rem !important;
            width: 200px !important;
            height: 160px !important;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3) !important;
        }
        .brand-logo-item:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45) !important;
            border-color: var(--gold) !important;
        }
        .brand-logo-item img {
            width: 100% !important;
            height: 110px !important;
            object-fit: contain !important;
            border-radius: 4px !important;
            background: transparent !important;
            padding: 0 !important;
            border: none !important;
        }
        @media (max-width: 768px) {
            .partners-section {
                padding: 2.5rem 0 3.5rem;
            }
            .brand-logo-item {
                width: 140px !important;
                height: 120px !important;
                padding: 1rem !important;
                border-radius: 8px !important;
            }
            .brand-logo-item img {
                height: 80px !important;
            }
            #all-brands-grid {
                gap: 1rem !important;
            }
        }
    </style>
</head>
<body>
    <saq-header></saq-header>
    <main>
        <section class="page-header">
            <div class="container">
                <span class="eyebrow" style="color: var(--navy-blue)">Our Partners</span>
                <h1 style="color: var(--charcoal); margin-bottom: 0;">Brands We Represent</h1>
            </div>
        </section>
        <section class="partners-section">
            <div class="container">
                <div class="brand-grid" id="all-brands-grid"></div>
            </div>
        </section>
    </main>
    <saq-footer></saq-footer>
    <mobile-contact-bar></mobile-contact-bar>
    <script src="js/data.js"></script>
    <script src="js/components.js?v=102"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('all-brands-grid');
            if (grid && window.siteData && window.siteData.brands) {
                window.siteData.brands.forEach((brand, index) => {
                    const item = document.createElement('div');
                    item.className = 'brand-logo-item fade-in-up visible';
                    if (brand.img) {
                        item.innerHTML = `<img src="${brand.img}" alt="${brand.name}">`;
                    } else {
                        item.innerHTML = `<div style="font-weight:700; color:var(--charcoal); font-size:1.1rem; letter-spacing:1px; text-align:center;">${brand.name.toUpperCase()}</div>`;
                    }
                    grid.appendChild(item);
                });
            }
        });
    </script>
</body>
</html>
